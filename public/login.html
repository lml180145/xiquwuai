<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 戏曲吾爱</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif; }
    body { background: linear-gradient(135deg, #8b1a1a, #2d1810); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
    .container { background:white; border-radius:24px; padding:40px; max-width:400px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
    h1 { text-align:center; color:#2d1810; font-size:28px; margin-bottom:8px; }
    .sub { text-align:center; color:#888; font-size:14px; margin-bottom:28px; }
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-weight:600; color:#2d1810; font-size:14px; margin-bottom:4px; }
    .form-group input { width:100%; padding:12px 16px; border-radius:12px; border:1.5px solid #ddd; font-size:16px; transition:0.3s; }
    .form-group input:focus { border-color:#8b1a1a; outline:none; box-shadow:0 0 0 3px rgba(139,26,26,0.2); }
    .btn { width:100%; padding:14px; border:none; border-radius:12px; font-size:18px; font-weight:700; cursor:pointer; transition:0.3s; }
    .btn-primary { background:#8b1a1a; color:white; }
    .btn-primary:hover { background:#5c0e0e; transform:scale(1.02); }
    .btn-secondary { background:#f5f0eb; color:#2d1810; margin-top:10px; }
    .btn-secondary:hover { background:#e0d5cc; }
    .error { color:#c0392b; background:#fde8e8; padding:10px; border-radius:8px; margin-bottom:16px; display:none; }
    .success { color:#1a7a3a; background:#e8f5ed; padding:10px; border-radius:8px; margin-bottom:16px; display:none; }
    .footer-text { text-align:center; margin-top:16px; color:#888; font-size:13px; }
    .footer-text a { color:#8b1a1a; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
<div class="container">
  <h1>🎭 戏曲吾爱</h1>
  <div class="sub">登录您的账号</div>
  <div id="errorMsg" class="error"></div>
  <div id="successMsg" class="success"></div>
  <form id="loginForm">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" required />
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" required />
    </div>
    <button type="submit" class="btn btn-primary">登 录</button>
  </form>
  <button class="btn btn-secondary" onclick="location.href='/register.html'">还没有账号？去注册</button>
  <div class="footer-text">
    <a href="/">← 返回首页</a>
  </div>
</div>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorEl = document.getElementById('errorMsg');
    const successEl = document.getElementById('successMsg');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    if (!username || !password) {
      errorEl.textContent = '请填写完整信息';
      errorEl.style.display = 'block';
      return;
    }
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        successEl.textContent = '✅ 登录成功！跳转中...';
        successEl.style.display = 'block';
        setTimeout(() => location.href = '/', 800);
      } else {
        errorEl.textContent = '❌ ' + (data.error || '登录失败');
        errorEl.style.display = 'block';
      }
    } catch(e) {
      errorEl.textContent = '网络错误，请稍后重试';
      errorEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
